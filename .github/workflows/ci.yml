name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against committed binary media (ADR-004)
        run: bash .github/scripts/check-binary-media.sh

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/clients/web/package-lock.json

      - name: Install web dependencies
        working-directory: src/clients/web
        run: npm ci

      - name: Regenerate OpenAPI TypeScript types from the built document
        working-directory: src/clients/web
        run: npm run gen:api

      # `dotnet build` earlier in this job regenerates openapi.json; this step regenerates
      # schema.d.ts from that committed document and diffs both artifacts.
      - name: Verify generated OpenAPI artifacts are up to date
        run: git diff --exit-code -- src/clients/web/openapi.json src/clients/web/src/lib/api/schema.d.ts

      - name: Web unit tests (Vitest)
        working-directory: src/clients/web
        run: npm test

      - name: Web build
        working-directory: src/clients/web
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: src/clients/web
        run: npx playwright install --with-deps chromium

      - name: Web end-to-end tests (Playwright)
        working-directory: src/clients/web
        run: npm run test:e2e:ci

      - name: Regenerate golden fixtures
        working-directory: src/clients/web
        run: npm run fixtures:generate

      - name: Verify golden fixtures are unchanged
        run: git diff --exit-code -- src/clients/web/fixtures/golden/

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            src/clients/web/playwright-report
            src/clients/web/test-results
          if-no-files-found: ignore
          retention-days: 7
